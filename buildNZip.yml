parameters:
  - name: "projectName"
    type: string
  - name: "framework"
    type: string
    values:
      - net10.0
      - net10.0-windows
      - net11.0
      - net11.0-windows
      - net12.0
      - net12.0-windows
      - net13.0
      - net13.0-windows
      - net14.0
      - net14.0-windows

jobs:
  - job: BuildNZip
    pool:
      name: x-agentpool
    workspace:
      clean: all
    variables:
      buildPlatform: "Any CPU"
      buildConfiguration: "Release"

    steps:
      - task: UseDotNet@2
        displayName: "Use .Net Core sdk from global.json"
        inputs:
          useGlobalJson: true

      - task: DotNetCoreCLI@2
        displayName: "dotnet restore"
        inputs:
          command: restore
          projects: ${{ parameters.projectName }}/${{ parameters.projectName }}.csproj
          feedsToUse: config
          nugetConfigPath: NuGet.config

      - task: DotNetCoreCLI@2
        displayName: "dotnet build"
        inputs:
          projects: ${{ parameters.projectName }}/${{ parameters.projectName }}.csproj
          arguments: "--configuration $(BuildConfiguration)"

      - task: DotNetCoreCLI@2
        displayName: "dotnet test ${{ parameters.projectName }}"
        inputs:
          command: test
          projects: ${{ parameters.projectName }}/${{ parameters.projectName }}.Tests/${{ parameters.projectName }}.Tests.csproj
          arguments: >
            --configuration $(BuildConfiguration)
            --framework ${{ parameters.framework }}
            -p:TestingPlatformDotnetTestSupport=true
            -p:TestingPlatformCommandLineArguments="--report-trx --report-trx-filename ${{ parameters.projectName }}.trx --results-directory $(Agent.TempDirectory)/TestResults --coverage --coverage-output-format cobertura --coverage-output ${{ parameters.projectName }}.cobertura.xml"
          publishTestResults: false
        continueOnError: true

      - task: PublishTestResults@2
        displayName: "publish test results"
        inputs:
          testResultsFormat: "VSTest"
          testResultsFiles: "$(Agent.TempDirectory)/TestResults/${{ parameters.projectName }}.trx"
          mergeTestResults: true
          failTaskOnFailedTests: true

      - task: DotNetCoreCLI@2
        displayName: "dotnet publish"
        inputs:
          command: "publish"
          publishWebProjects: false
          projects: "${{ parameters.projectName }}/${{ parameters.projectName }}.csproj"
          arguments: "-c $(BuildConfiguration) -o $(Build.ArtifactStagingDirectory)/Output --framework ${{ parameters.framework }} --self-contained false --no-build"
          zipAfterPublish: true
          modifyOutputPath: true

      - task: reportgenerator@5
        displayName: "publish code coverage results"
        inputs:
          reports: "$(Agent.TempDirectory)/TestResults/*.cobertura.xml"
          targetdir: "$(Agent.TempDirectory)/CoverageReport"
          reporttypes: "HtmlInline_AzurePipelines;Cobertura"
          publishCodeCoverageResults: true

      - task: PublishBuildArtifacts@1
        displayName: "publish build artifacts"
        inputs:
          ArtifactName: "ZipArchive"
        condition: succeededOrFailed()
