parameters:
  - name: "projects"
    type: object
    default: []
  - name: "framework"
    type: string
    values:
      - net10.0
      - net10.0-windows
      - net11.0
      - net11.0-windows
      - net12.0
      - net12.0-windows
      - net13.0
      - net13.0-windows
      - net14.0
      - net14.0-windows
  - name: "projectsParentDirectory"
    type: string
  - name: "testsParentDirectory"
    type: string

jobs:
  - job: BuildNPack
    pool:
      name: x-agentpool
    workspace:
      clean: all
    variables:
      buildPlatform: "Any CPU"
      buildConfiguration: "Release"

    steps:
      - task: UseDotNet@2
        displayName: "Use .Net Core sdk from global.json"
        inputs:
          packageType: "sdk"
          useGlobalJson: true
          includePreviewVersions: true

      - ${{ each project in parameters.projects }}:
          - task: DotNetCoreCLI@2
            displayName: "dotnet restore ${{ project }}"
            inputs:
              command: restore
              projects: ${{ parameters.projectsParentDirectory }}${{ project }}/${{ project }}.csproj
              feedsToUse: config
              nugetConfigPath: NuGet.config

          - task: DotNetCoreCLI@2
            displayName: "dotnet build ${{ project }}"
            inputs:
              projects: ${{ parameters.projectsParentDirectory }}${{ project }}/${{ project }}.csproj
              arguments: "--configuration $(BuildConfiguration)"

          - task: DotNetCoreCLI@2
            displayName: "dotnet test ${{ project }}"
            inputs:
              command: test
              projects: ${{ parameters.testsParentDirectory }}${{ project }}.Tests/${{ project }}.Tests.csproj
              arguments: >
                --configuration $(BuildConfiguration)
                --framework ${{ parameters.framework }}
                --parallel none
                --coverage
                --coverage-output-format cobertura
                --coverage-output "$(Agent.TempDirectory)/TestResults/${{ project }}/coverage.cobertura.xml"
              publishTestResults: true
            continueOnError: true

          # - task: PublishCodeCoverageResults@2
          #   displayName: "publish code coverage ${{ project }}"
          #   inputs:
          #     summaryFileLocation: "$(Agent.TempDirectory)/TestResults/${{ project }}/**/coverage.cobertura.xml"
          #     reportDirectory: "$(Agent.TempDirectory)/TestResults/${{ project }}"
          #     failIfCoverageEmpty: false
          #   continueOnError: true

          - task: DotNetCoreCLI@2
            displayName: "dotnet custom pack release"
            inputs:
              command: custom
              projects: ${{ parameters.projectsParentDirectory }}${{ project }}/${{ project }}.csproj
              custom: pack
              arguments: "-c $(BuildConfiguration) -o $(Build.ArtifactStagingDirectory) --no-build"
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

          - task: DotNetCoreCLI@2
            displayName: "dotnet custom pack preview"
            inputs:
              command: custom
              projects: ${{ parameters.projectsParentDirectory }}${{ project }}/${{ project }}.csproj
              custom: pack
              arguments: "-c $(BuildConfiguration) -o $(Build.ArtifactStagingDirectory) --no-build --version-suffix $(Build.SourceBranchName)"
            condition: and(succeeded(), ne(variables['Build.SourceBranch'], 'refs/heads/main'))

      - task: PublishBuildArtifacts@1
        displayName: "publish build artifacts"
        inputs:
          ArtifactName: "$(Build.SourceBranchName)"
        condition: succeededOrFailed()
