name: Build and pack .NET projects

on:
  workflow_call:
    inputs:
      projects:
        description: JSON array of project names.
        required: true
        type: string
      framework:
        description: Target framework used when running tests.
        required: true
        type: string
      projects-parent-directory:
        description: Parent directory of the projects, including a trailing slash when applicable.
        required: true
        type: string
      tests-parent-directory:
        description: Parent directory of the test projects, including a trailing slash when applicable.
        required: true
        type: string
      artifact-name:
        description: Name of the package artifact.
        default: Nuget-Package
        required: false
        type: string

jobs:
  build-and-pack:
    runs-on:
      group: Default
      labels: linux
    env:
      BUILD_CONFIGURATION: Release
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore, build, test, and pack projects
        shell: bash
        env:
          PROJECTS: ${{ inputs.projects }}
          PROJECTS_PARENT_DIRECTORY: ${{ inputs.projects-parent-directory }}
          TESTS_PARENT_DIRECTORY: ${{ inputs.tests-parent-directory }}
          TEST_FRAMEWORK: ${{ inputs.framework }}
        run: |
          set -euo pipefail
          jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and length > 0)' <<< "$PROJECTS" >/dev/null
          mapfile -t projects < <(jq -r '.[]' <<< "$PROJECTS")
          packages_directory="$RUNNER_TEMP/packages"
          test_results_directory="$RUNNER_TEMP/TestResults"
          mkdir -p "$packages_directory" "$test_results_directory"

          for project in "${projects[@]}"; do
            project_file="${PROJECTS_PARENT_DIRECTORY}${project}/${project}.csproj"
            test_project_file="${TESTS_PARENT_DIRECTORY}${project}.Tests/${project}.Tests.csproj"
            project_test_results_directory="$test_results_directory/$project"
            mkdir -p "$project_test_results_directory"

            dotnet restore "$project_file" --configfile NuGet.config
            dotnet build "$project_file" --configuration "$BUILD_CONFIGURATION" --no-restore

            if ! dotnet test "$test_project_file" \
              --configuration "$BUILD_CONFIGURATION" \
              --framework "$TEST_FRAMEWORK" \
              --parallel none \
              --coverage \
              --coverage-output-format cobertura \
              --coverage-output "$project_test_results_directory/coverage.cobertura.xml"; then
              echo "WARNING: Tests failed for $project; continuing to match the Azure DevOps template." >&2
            fi

            pack_arguments=(
              pack "$project_file"
              --configuration "$BUILD_CONFIGURATION"
              --output "$packages_directory"
              --no-build
            )
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              pack_arguments+=(--version-suffix "$GITHUB_REF_NAME")
            fi

            dotnet "${pack_arguments[@]}"
          done

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}-coverage
          path: ${{ runner.temp }}/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

      - name: Upload NuGet packages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/packages/*.nupkg
          if-no-files-found: warn
